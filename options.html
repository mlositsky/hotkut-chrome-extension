<!doctype html>
<html>
  <head>
    <title>Quick Switch To Tab Sites Configuration</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      label {
        display: inline-block;
        width: 120px;
      }
      input {
        width: 250px;
        margin-bottom: 10px;
      }
      .site {
        margin-bottom: 15px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        margin-top: 10px;
      }
      .hotkey {
        font-size: 0.9em;
        color: #666;
        margin-top: 5px;
        font-style: italic;
      }
      .hotkey-btn {
        background: none;
        border: none;
        padding: 0;
        color: #1a73e8;
        cursor: pointer;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h2>Configurable Sites</h2>
    <div id="sites"></div>
    <button id="save">Save</button>
    <button id="reset">Reset</button>
    <div id="status"></div>
    <script type="module" src="options.js"></script>
  </body>
</html>
