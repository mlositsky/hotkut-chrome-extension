<!doctype html>

<html>
  <head>
    <title>HotKut Sites Configuration</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }

      /* Status message with soft fade animation */
      #status {
        min-height: 22px;
        margin-bottom: 10px;
        opacity: 0;
        transition: opacity 0.35s ease;
      }

      #status.visible {
        opacity: 1;
      }

      label {
        display: inline-block;
        width: 120px;
      }

      input {
        width: 250px;
        margin-bottom: 10px;
      }

      .site {
        margin-bottom: 15px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      button {
        margin-top: 10px;
      }

      .hotkey {
        font-size: 0.9em;
        color: #666;
        margin-top: 5px;
        font-style: italic;
      }

      .hotkey-btn {
        background: none;
        border: none;
        padding: 0;
        color: #1a73e8;
        cursor: pointer;
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <h2>Configurable Sites</h2>
    <div id="status"></div>

    <div id="sites"></div>

    <button id="save">Save</button>
    <button id="reset">Reset</button>

    <script type="module" src="options.js"></script>
  </body>
</html>
